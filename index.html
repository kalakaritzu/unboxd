<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unboxd</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<link rel="icon" href="assets/logo/unboxd-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=optional">
<style>
  :root { --bg:#100f14; --panel:#1a1923; --panel2:#262431; --text:#ffffff; --muted:#817e8f; --accent:#806cf5; --line:#2e2c3a; --green:#26ff85; --ink:#030826; --red:#f05f75; }
  * { box-sizing:border-box; }
  html { scrollbar-gutter:stable; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; }
  h1 { margin:0; font-size:22px; } h1 span { color:var(--accent); }
  body { display:flex; min-height:100vh; }
  /* sidebar: a slim icon rail that opens over the page (labels appear to the right) while the pointer is on it */
  body { padding-left:68px; }                      /* the rail opens over the page without moving it */
  #side { position:fixed; left:0; top:0; bottom:0; width:68px; overflow:hidden; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:stretch; padding:12px 8px; gap:6px; z-index:30; transition:width .18s ease, box-shadow .18s ease; }
  #side:hover, #side.kbd { width:210px; box-shadow:6px 0 24px rgba(0,0,0,.45); }
  #side .logo { font-size:20px; font-weight:800; text-align:center; margin:2px 0 12px; letter-spacing:-.5px; white-space:nowrap; } #side .logo span { color:var(--accent); }
  #side .sp { flex:1; }
  .nav { position:relative; display:flex; flex-direction:row; align-items:center; gap:16px; height:44px; padding:0 0 0 14px; border:0; background:none; color:var(--muted); border-radius:4px; cursor:pointer; font:inherit; font-size:14px; white-space:nowrap; text-align:left; }
  .nav svg { flex:none; width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .nav .t { opacity:0; transition:opacity .12s ease; }
  #side:hover .nav .t, #side.kbd .nav .t { opacity:1; transition-delay:.06s; }
  .nav:hover { color:var(--text); background:var(--panel2); }
  .nav.on { color:var(--accent); background:var(--panel2); }
  .nav.on::before { content:""; position:absolute; left:-8px; top:10px; bottom:10px; width:3px; border-radius:0 3px 3px 0; background:var(--accent); }
  .nav .badge { position:absolute; top:3px; left:30px; min-width:16px; height:16px; padding:0 4px; border-radius:4px; background:var(--accent); color:#fff; font-size:10px; font-weight:700; line-height:16px; text-align:center; }
  .nav .badge:empty { display:none; }
  #side .wallet { text-align:center; font-size:12px; font-weight:700; color:var(--accent); background:var(--panel2); border-radius:4px; padding:6px 2px; margin:0 0 10px; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; height:38px; }
  #side .wallet small { display:block; height:11px; line-height:11px; font-size:9px; font-weight:500; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; opacity:0; transition:opacity .12s ease; }
  #side:hover .wallet small, #side.kbd .wallet small { opacity:1; transition-delay:.06s; }
  #content { flex:1; min-width:0; }
  .view { display:none; } .view.on { display:block; } main.view.on { display:flex; }
  .setting { display:flex; align-items:center; gap:16px; padding:14px 0; border-bottom:1px solid var(--line); }
  .setting:last-child { border-bottom:0; } .setting .d { flex:1; } .setting .d b { display:block; font-size:14px; margin-bottom:2px; } .setting .d span { font-size:12px; color:var(--muted); }
  .setting button { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:7px 16px; cursor:pointer; min-width:64px; }
  .setting button.on { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; }
  @media (max-width:700px){      /* phones: no hover, so the rail becomes a bottom bar that keeps its labels */
    body, body.sideOpen { padding-left:0; flex-direction:column-reverse; }
    #side { left:0; right:0; top:auto; bottom:0; width:auto; height:62px; flex-direction:row; padding:4px 6px; border-right:0; border-top:1px solid var(--line); overflow:visible; }
    #side:hover, #side.kbd { width:auto; box-shadow:none; }
    #side .logo, #side .sp { display:none; }
    .nav { flex:1; flex-direction:column; justify-content:center; gap:2px; height:auto; padding:6px 2px; font-size:10px; }
    .nav .t { opacity:1; }
    .nav .badge { left:auto; right:12%; top:2px; }
    .nav.on::before { left:20%; right:20%; top:-4px; bottom:auto; width:auto; height:3px; border-radius:0 0 3px 3px; }
    #side .wallet { position:absolute; left:6px; bottom:66px; margin:0; padding:4px 8px; }
    main, #v-upgrader { padding-bottom:84px !important; }
  }
  .case .price { display:block; margin-top:3px; font-size:10px; color:var(--muted); } .case .price.free { color:#5fd38d; font-weight:700; }
  #keybar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px; font-size:13px; color:var(--muted); }
  #keybar b { color:var(--text); }
  #keybar button, .sellbtn, #sellAll { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:8px 14px; cursor:pointer; font:inherit; font-size:13px; }
  #keybar button:hover, .sellbtn:hover, #sellAll:hover { border-color:var(--accent); }
  #keybar button:disabled { opacity:.45; cursor:default; border-color:var(--line); }
  #keybar .msg { color:#ff7a7a; }
  #invTop { display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; } #invTop .tot { color:var(--muted); font-size:13px; flex:1; } #invTop .tot b { color:#5fd38d; }
  /* inventory, laid out like the CS2 one: a grid of item tiles, a filter bar on top, the selected item's details on the right */
  #invBar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  #invBar h2 { margin:0; } #invTotal { color:var(--muted); font-size:13px; } #invTotal b { color:#5fd38d; }
  #invBar .grow { flex:1; }
  #invSearch, #invSort { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:8px 12px; font:inherit; font-size:13px; }
  #invSearch { width:220px; } #invSearch:focus, #invSort:focus { outline:none; border-color:var(--accent); }
  #invFilters { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { background:var(--panel); color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:6px 14px; font:inherit; font-size:12px; cursor:pointer; }
  .chip:hover { color:var(--text); } .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  #invLayout { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:18px; align-items:start; }
  #invGrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(148px, 1fr)); gap:10px; align-content:start; }
  .icard { position:relative; background:linear-gradient(180deg, var(--panel) 40%, color-mix(in srgb, var(--c) 16%, var(--panel))); border:1px solid var(--line); border-radius:4px; padding:8px 8px 0; cursor:pointer; overflow:hidden; display:flex; flex-direction:column; }
  .icard::after { content:""; position:absolute; left:0; right:0; bottom:0; height:4px; background:var(--c); }
  .icard:hover { border-color:color-mix(in srgb, var(--c) 70%, #fff 0%); transform:translateY(-1px); }
  .icard.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .icard .top { display:flex; justify-content:space-between; align-items:center; font-size:10px; min-height:14px; color:var(--muted); }
  .icard .st { color:#cf6a32; font-weight:700; } .icard .wr { margin-left:auto; font-weight:700; letter-spacing:.04em; }
  .icard img { width:100%; height:92px; object-fit:contain; margin:4px 0; }
  .icard .wn { font-size:10px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .icard .sn { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .icard .pr { font-size:11px; color:#5fd38d; padding:3px 0 10px; font-variant-numeric:tabular-nums; }
  #invDetail, #ctDetail { position:sticky; top:72px; background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:16px; display:flex; flex-direction:column; gap:10px; min-height:180px; }
  #invDetail .hint, #ctDetail .hint { color:var(--muted); font-size:13px; margin:auto; text-align:center; padding:30px 10px; }
  #invDetail .dimg, #ctDetail .dimg { background:radial-gradient(closest-side, color-mix(in srgb, var(--c) 30%, transparent), transparent); }
  #invDetail img, #ctDetail img { width:100%; height:170px; object-fit:contain; }
  #invDetail .dw, #ctDetail .dw { font-size:12px; color:var(--muted); } #invDetail .dn, #ctDetail .dn { font-size:20px; font-weight:700; line-height:1.2; } #invDetail .dn .st, #ctDetail .dn .st { color:#cf6a32; }
  #invDetail .dr, #ctDetail .dr { font-size:13px; font-weight:600; color:var(--c); }
  #invDetail dl, #ctDetail dl { margin:4px 0; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:12px; } #invDetail dt, #ctDetail dt { color:var(--muted); } #invDetail dd, #ctDetail dd { margin:0; text-align:right; }
  #invDetail dd.val, #ctDetail dd.val { color:#5fd38d; font-weight:700; }
  #invDetail .btns, #ctDetail .btns { display:flex; gap:8px; } #invDetail .btns button, #ctDetail .btns button { flex:1; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:10px 6px; cursor:pointer; font:inherit; font-size:13px; }
  #invDetail .btns button:hover, #ctDetail .btns button:hover { border-color:var(--accent); } #invDetail .btns button.sell { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  @media (max-width:1000px){ #invLayout, #ctLayout { grid-template-columns:1fr; } #invDetail, #ctDetail { position:static; order:-1; } }
  /* upgrader */
  .uppanel { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:14px; display:flex; flex-direction:column; gap:10px; min-height:0; }
  .uppanel h2 { margin:0; display:flex; align-items:center; gap:10px; } .uppanel h2 .sum { margin-left:auto; font-size:12px; color:var(--muted); text-transform:none; letter-spacing:0; font-weight:500; } .uppanel h2 .sum b { color:#5fd38d; }
  .upbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .upbar input, .upbar select { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:7px 10px; font:inherit; font-size:12px; min-width:0; }
  .upbar input { flex:1; } .upbar input:focus, .upbar select:focus { outline:none; border-color:var(--accent); }
  .upgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(112px, 1fr)); grid-auto-rows:max-content; gap:8px; max-height:330px; overflow:auto; padding:2px; align-content:start; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  .upgrid .icard { padding:6px 6px 0; } .upgrid .icard img { height:58px; margin:2px 0; } .upgrid .icard .sn { font-size:11px; } .upgrid .icard .wn { font-size:9px; } .upgrid .icard .pr { font-size:10px; padding:2px 0 8px; }
  .icard.pick { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .mults { display:flex; gap:6px; flex-wrap:wrap; } .mults .chip { padding:4px 10px; }
  /* the dial: a full ring with the win slice; the white pointer travels round it and stops where the roll landed */
  #upGrid { display:grid; grid-template-columns:minmax(0,1fr) minmax(340px,470px) minmax(0,1fr); gap:18px; align-items:start; }
  #upCenter { display:flex; flex-direction:column; align-items:center; gap:14px; position:sticky; top:72px; }
  #upGo { width:min(100%,320px); background:var(--accent); color:#fff; border:0; border-radius:4px; padding:14px; font:inherit; font-size:17px; font-weight:800; cursor:pointer; }
  #upGo:disabled { opacity:.35; cursor:default; }
  #upSummary { font-size:13px; color:var(--muted); text-align:center; min-height:18px; } #upSummary b { color:var(--text); }
  @media (max-width:1280px){ #upGrid { grid-template-columns:1fr 1fr; } #upCenter { grid-column:1/-1; order:-1; position:static; } }
  @media (max-width:800px){ #upGrid { grid-template-columns:1fr; } }
  /* case contents */
  #ctBar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:12px 16px; }
  #ctBar img { height:64px; filter:drop-shadow(0 6px 8px rgba(0,0,0,.5)); } #ctBar .ctn { font-size:20px; font-weight:700; } #ctBar .cts { font-size:12px; color:var(--muted); margin-top:2px; }
  #ctBar .grow { flex:1; } #ctCase { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:8px 12px; font:inherit; font-size:13px; max-width:240px; }
  #ctBar button { background:var(--accent); color:#fff; border:0; border-radius:4px; padding:10px 18px; font:inherit; font-weight:700; cursor:pointer; }
  #ctLayout { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:18px; align-items:start; }
  #contents .tier { margin-bottom:22px; }
  #contents .th { display:flex; align-items:baseline; gap:10px; padding-bottom:8px; margin-bottom:10px; border-bottom:2px solid var(--c); }
  #contents .th b { color:var(--c); font-size:15px; } #contents .th span { color:var(--muted); font-size:12px; } #contents .th .pct { margin-left:auto; color:var(--text); font-weight:700; font-size:14px; }
  #contents .cgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(148px, 1fr)); gap:10px; }
  #contents .more { background:var(--panel); color:var(--muted); border:1px dashed var(--line); border-radius:4px; cursor:pointer; font:inherit; font-size:13px; min-height:90px; }
  #contents .more:hover { color:var(--text); border-color:var(--accent); }
  /* keys: a shop on the left, what you own on the right */
  #keysLayout { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:22px; align-items:start; }
  #keysBar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; } #keysBar h2 { margin:0; } #keysBar .grow { flex:1; }
  #keySearch, #keySort { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:8px 12px; font:inherit; font-size:13px; }
  #keySearch { width:200px; } #keySearch:focus, #keySort:focus { outline:none; border-color:var(--accent); }
  #keysFilters { display:flex; gap:6px; margin-bottom:16px; }
  #keysGrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:16px; }
  .keycard { position:relative; background:var(--panel); border-radius:4px; padding:16px 16px 14px; display:flex; flex-direction:column; gap:10px; overflow:hidden; }
  .keycard::before { content:""; position:absolute; left:0; right:0; top:0; height:150px; background:radial-gradient(ellipse 60% 70% at 50% 45%, color-mix(in srgb, var(--k) 38%, transparent), transparent); pointer-events:none; }
  .keycard img.key { position:relative; width:100%; height:112px; object-fit:contain; filter:drop-shadow(0 8px 10px rgba(0,0,0,.5)); transform:rotate(-6deg); }
  .keycard .own { position:absolute; top:10px; right:10px; background:var(--accent); color:#fff; font-weight:700; font-size:12px; border-radius:4px; padding:1px 9px; }
  .keycard .kn { position:relative; font-weight:700; font-size:17px; line-height:1.15; }
  .keycard .kc { display:flex; align-items:center; gap:4px; min-height:30px; } .keycard .kc img { height:28px; width:34px; object-fit:contain; } .keycard .kc span { font-size:11px; color:var(--muted); margin-left:4px; }
  .keycard .kbuy { display:flex; align-items:center; gap:8px; margin-top:2px; }
  .step { display:flex; align-items:center; background:var(--panel2); border-radius:4px; } .step button { width:28px; height:34px; background:none; border:0; color:var(--text); font-size:16px; cursor:pointer; border-radius:4px; } .step button:hover:not(:disabled) { color:var(--accent); } .step button:disabled { opacity:.3; cursor:default; }
  .step b { min-width:24px; text-align:center; font-variant-numeric:tabular-nums; font-size:14px; }
  .keycard .buy { flex:1; height:34px; background:var(--accent); color:#fff; border:0; border-radius:4px; font:inherit; font-weight:700; font-size:14px; cursor:pointer; font-variant-numeric:tabular-nums; }
  .keycard .buy:hover:not(:disabled) { filter:brightness(1.1); } .keycard .buy:disabled { background:var(--panel2); color:var(--muted); cursor:default; }
  #keysSide { position:sticky; top:72px; background:var(--panel); border-radius:4px; padding:18px; display:flex; flex-direction:column; gap:14px; }
  #keysSide .bal small { display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); } #keysSide .bal b { font-family:Inter,system-ui,sans-serif; font-size:34px; color:var(--accent); line-height:1.1; font-variant-numeric:tabular-nums; }
  #keysSide h3 { margin:4px 0 0; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; }
  #keysSide .hint { font-size:13px; color:var(--muted); line-height:1.45; }
  #keysSide .ok { display:flex; align-items:center; gap:10px; } #keysSide .ok img { width:46px; height:36px; object-fit:contain; } #keysSide .ok .t { flex:1; min-width:0; font-size:13px; font-weight:600; line-height:1.2; } #keysSide .ok .t span { display:block; font-weight:400; font-size:11px; color:var(--muted); }
  #keysSide .ok .n { font-family:Inter,system-ui,sans-serif; font-size:20px; font-weight:700; color:var(--accent); }
  @media (max-width:1000px){ #keysLayout { grid-template-columns:1fr; } #keysSide { position:static; order:-1; } }
  main { margin:0; padding:22px 28px 60px; display:flex; flex-direction:column; gap:20px; }
  #v-settings { max-width:760px; }       /* reading views stay a comfortable width, next to the sidebar */
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 10px; font-weight:600; }

  /* case picker: a grid of case cards (search + sort on top) next to the selected case's panel, like the CS2 container screen */
  #caseLayout { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:18px; align-items:start; }
  #caseBar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; } #caseBar h2 { margin:0; } #caseBar .grow { flex:1; }
  #caseSearch, #caseSort { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:8px 12px; font:inherit; font-size:13px; }
  #caseSearch { width:200px; } #caseSearch:focus, #caseSort:focus { outline:none; border-color:var(--accent); }
  #cases { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  .case { position:relative; padding:12px 8px 10px; background:var(--panel); border:1px solid var(--line); border-radius:4px; cursor:pointer; text-align:center; display:flex; flex-direction:column; align-items:center; transition:transform .12s ease, border-color .12s ease; }
  .case:hover { border-color:#4a5268; transform:translateY(-2px); }
  .case.sel { border-color:var(--accent); background:linear-gradient(180deg, var(--panel2), var(--panel)); box-shadow:0 0 0 1px var(--accent) inset; }
  .case img { width:100%; height:96px; object-fit:contain; filter:drop-shadow(0 6px 8px rgba(0,0,0,.45)); }
  .case .cn { font-size:12px; margin-top:6px; line-height:1.25; min-height:30px; display:flex; align-items:center; }
  .case .price { margin-top:4px; font-size:11px; color:var(--muted); } .case .price.free { color:#5fd38d; font-weight:700; letter-spacing:.06em; }
  .case .own { position:absolute; top:6px; right:6px; background:var(--accent); color:#fff; font-size:10px; font-weight:700; border-radius:4px; padding:1px 7px; } .case .own:empty { display:none; }
  #casePanel { position:sticky; top:72px; background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:16px; display:flex; flex-direction:column; gap:12px; }
  #casePanel .cimg { background:radial-gradient(closest-side, rgba(128,108,245,.16), transparent); text-align:center; } #casePanel .cimg img { height:150px; max-width:100%; object-fit:contain; filter:drop-shadow(0 8px 10px rgba(0,0,0,.5)); }
  #casePanel .cname { font-size:20px; font-weight:700; text-align:center; } #casePanel .csub { font-size:12px; color:var(--muted); text-align:center; margin-top:-8px; }
  #keybar { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted); text-align:center; }
  #casePanel #open { width:100%; }
  #casePanel h3 { margin:2px 0 0; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; }
  #cpContents .grp { margin-bottom:8px; } #cpContents .grp .items { gap:4px; } #cpContents .grp .it { width:52px; padding:3px; } #cpContents .grp .it img { height:30px; } #cpContents .grp .it div { display:none; }
  @media (max-width:1000px){ #caseLayout { grid-template-columns:1fr; } #casePanel { position:static; order:-1; } }

  /* roulette */
  #stage { position:relative; background:linear-gradient(180deg, #161922, #0f1117); border:1px solid var(--line); border-radius:4px; overflow:hidden; height:212px; transition:height .35s cubic-bezier(.2,.8,.2,1); box-shadow:inset 0 0 40px rgba(0,0,0,.55); --rh:210px; }
  #reels { display:flex; flex-direction:column; }

  #dlgBox.wide { width:min(540px, 100%); } #dlgText .dayrow { display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; margin-top:16px; }
  .d7 { background:#312f3d; border-radius:4px; padding:10px 2px; text-align:center; font-size:12px; font-weight:500; color:#8f8c9e; } .d7 b { display:block; margin-top:4px; font-size:14px; color:#fff; font-variant-numeric:tabular-nums; }

  .stbest .tn { font-size:18px; font-weight:700; margin-top:8px; } .stbest .tw { font-size:14px; color:#8f8c9e; margin-top:2px; } .stbest .pr { font-size:24px; font-weight:700; color:var(--green); margin-top:6px; } .stnone { color:#555261; padding:40px 0; text-align:center; }
  #stReset { align-self:flex-start; }
  @media (max-width:1000px){ .stcols { grid-template-columns:1fr; } }
  /* the reel, closer to CS2: each tile names its weapon and skin, and the one you land on stays lit */
  .tile .in { padding:10px 6px 8px; justify-content:flex-start; gap:0; } .tile img { height:100px; }

  .reel.landed .tile.hit .in { box-shadow:inset 0 -3px 0 var(--c), 0 0 0 2px rgba(255,255,255,.85), 0 0 28px color-mix(in srgb, var(--c) 60%, transparent); }
  #marker { top:16px; bottom:16px; width:2px; margin-left:-1px; background:#d3df45; border-radius:1px; box-shadow:0 0 9px rgba(211,223,69,.65); z-index:3; } #marker::before, #marker::after { display:none; }

  /* nothing is spinning yet: the reel is folded away and the cases sit at the top; it opens out smoothly on the first open */

  <h1 style="font-size:34px" aria-label="Unboxd"><img src="assets/logo/unboxd-icon.svg" alt="Unboxd"></h1>
  <div id="loadMsg">Loading...</div>
  <div class="bar"><i id="loadBar"></i></div>
  <div id="loadSub"></div>

<script>
const $ = id => document.getElementById(id);
const PITCH = 172;            // tile width in px (must match .tile width)
const SPIN_MS = 4000;
const STORE = 'unboxd.inventory.v1';

let D, caseById = {}, rarityByName = {}, cur = null, busy = false, anim = null, anims = [], muted = false, audio = null;
let inventory = []; const INV_MAX = 10000;           // most skins saved in the browser (each is about 150 bytes, and the browser allows about 5 MB)
try { inventory = JSON.parse(localStorage.getItem(STORE) || '[]'); } catch {}

// ---------------- rolling ----------------
const rand = Math.random;

function poolFor(c){
  const pool = {};
  D.rarities.forEach(r => pool[r.name] = []);
  c.drops.forEach(id => pool[D.items[id].rarity]?.push(id));
  c.rare.forEach(id => pool['Rare Special Item'].push(id));
  return pool;
}

// pick a rarity tier by the real odds; tiers a case doesn't have are skipped and the rest renormalised
function rollTier(pool){
  const tiers = D.rarities.filter(r => pool[r.name].length);
  let x = rand() * tiers.reduce((s, r) => s + r.odds, 0);
  for (const r of tiers){ x -= r.odds; if (x < 0) return r.name; }
  return tiers[tiers.length - 1].name;
}
function rollItem(pool){ const ids = pool[rollTier(pool)]; return D.items[ids[Math.floor(rand() * ids.length)]]; }

function wearOf(f){ return D.wear_bands.find(w => f < w.max)?.name || D.wear_bands.at(-1).name; }

function rollDrop(c){
  const pool = poolFor(c), item = rollItem(pool);
  const float = item.min_float + rand() * (item.max_float - item.min_float);
  return { item, float, wear: wearOf(float), stattrak: item.stattrak && rand() < 0.10, t: Date.now(), uid: Math.random().toString(36).slice(2) + Date.now().toString(36) };
}

// ---------------- audio ----------------
function ctx(){ return audio ||= new (window.AudioContext || window.webkitAudioContext)(); }
function beep(freq, dur, vol, type='triangle', when=0){
  if (muted) return;
  const a = ctx(), o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, a.currentTime + when);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + when + dur);
  o.connect(g).connect(a.destination); o.start(a.currentTime + when); o.stop(a.currentTime + when + dur);
}
// the game's real CS2 sounds (assets/sounds, taken from the game files): decoded once, then played on demand
const SND = {}, SND_LOAD = {}, SND_GAIN = 0.28;
function snd(name, vol = 1){
  if (muted) return;
  const a = ctx(), b = SND[name];
  if (b){ const s = a.createBufferSource(), gn = a.createGain(); s.buffer = b; gn.gain.value = vol ? SND_GAIN * (name === 'tick' ? .6 : 1) : 0; s.connect(gn).connect(a.destination); s.start(); return; }
  if (SND_LOAD[name]) return;
  SND_LOAD[name] = fetch('assets/sounds/' + name + '.mp3').then(r => r.arrayBuffer()).then(d => a.decodeAudioData(d)).then(x => { SND[name] = x; }).catch(() => {});
}
['tick', 'open', 'coin', 'key', 'buy', 'deny', 'click', 'r0', 'r1', 'r2', 'r3', 'r4'].forEach(n => addEventListener('pointerdown', () => { if (!SND[n] && !SND_LOAD[n] && !muted) snd(n, 0); }, { once: true }));
const tick = () => snd('tick', .5);
function reveal(rarity){
  const n = { 'Mil-Spec Grade':0, 'Restricted':1, 'Classified':2, 'Covert':3, 'Rare Special Item':4 }[rarity] || 0;
  snd('r' + n, .8);
}

// ---------------- UI ----------------
const img = src => src ? `<img src="${src}" loading="lazy" alt="">` : '';
let WEARIMG = {};                               // data/wear_images.json: item id -> picture per condition (made by scripts/fetch_wear_images.py)
const itemSrc = (it, wear) => { const i = D.wear_bands.findIndex(w => w.name === wear); return (i >= 0 && WEARIMG[it.id]?.[i]) || it.image; };

let caseQuery = '', caseSort = 'new';
function renderCases(){
  const q = caseQuery.trim().toLowerCase(), list = D.cases.filter(c => !q || c.name.toLowerCase().includes(q));
  const idx = new Map(D.cases.map((c, i) => [c.id, i])), price = c => caseInfo[c.id]?.free ? -1 : (caseInfo[c.id]?.key.price ?? 0);
  const order = { new: (a, b) => idx.get(b.id) - idx.get(a.id), old: (a, b) => idx.get(a.id) - idx.get(b.id), cheap: (a, b) => price(a) - price(b), dear: (a, b) => price(b) - price(a), name: (a, b) => a.name.localeCompare(b.name) }[caseSort];
  $('cases').innerHTML = list.sort(order).map(c =>
    `<div class="case${cur && cur.id === c.id ? ' sel' : ''}" data-id="${c.id}">${img(c.image)}<span class="own" data-own="${c.id}"></span><div class="cn">${c.name}</div><span class="price" data-price="${c.id}"></span></div>`).join('')
    || '<div class="empty" style="grid-column:1/-1;padding:24px 0">No case matches.</div>';
  $('cases').onclick = e => { const el = e.target.closest('.case'); if (el && !busy) selectCase(el.dataset.id); };
  refreshEconomy();
}

function selectCase(id){
  cur = caseById[id];
  document.querySelectorAll('.case').forEach(el => {
    const on = el.dataset.id === id;
    el.classList.toggle('sel', on);
  });
  $('opened').textContent = ''; keyMsg = '';
  ctSel = null; ctRareAll = false; renderContents(); renderCasePanel(); refreshEconomy();
}

// the selected case's panel: picture, what it needs to open, and a compact look at what it holds
function renderCasePanel(){
  if (!cur) return;
  $('cpImg').src = cur.image; $('cpName').textContent = cur.name; preloadCase(cur);
  $('cpSub').textContent = cur.first_sale_date ? 'In the game since ' + cur.first_sale_date.slice(0, 4) : '';
  const pool = poolFor(cur), tiers = D.rarities.filter(r => pool[r.name].length), total = tiers.reduce((s, r) => s + r.odds, 0);
  $('cpContents').innerHTML = tiers.map(r => {
    const ids = pool[r.name], rare = r.name === 'Rare Special Item', show = ids.slice(0, rare ? 6 : 12), more = ids.length - show.length;
    return `<div class="grp" style="--c:${r.color}"><div class="gh"><span style="color:${r.color}">${r.name}</span><span>${(r.odds / total * 100).toFixed(2)}%</span></div>
      <div class="items">${show.map(i => `<div class="it" title="${D.items[i].name}">${itemImg(D.items[i])}</div>`).join('')}${more > 0 ? `<div class="empty" style="align-self:center;font-size:11px">+${more}</div>` : ''}</div></div>`;
  }).join('');
}

let ctSel = null, ctRareAll = false;
const wearRange = it => it.wears.map(w => WEAR_SHORT[w]).filter(Boolean);
function renderContents(){
  const pool = poolFor(cur), tiers = D.rarities.filter(r => pool[r.name].length), total = tiers.reduce((s, r) => s + r.odds, 0);
  $('contentsTitle').textContent = cur.name;
  $('ctImg').src = cur.image;
  const info = caseInfo[cur.id], n = D.cases.length;
  $('ctSub').textContent = [cur.first_sale_date ? 'In the game since ' + cur.first_sale_date.slice(0, 4) : '', `${cur.drops.length + cur.rare.length} items`, info ? (info.free ? 'free to open' : 'key ' + money(info.key.price)) : ''].filter(Boolean).join(' · ');
  if (!$('ctCase').options.length) $('ctCase').innerHTML = [...D.cases].reverse().map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  $('ctCase').value = cur.id; $('ctCase').ddSync?.();
  $('contents').innerHTML = tiers.map(r => {
    const ids = pool[r.name], rare = r.name === 'Rare Special Item', collapsed = rare && !ctRareAll && ids.length > 11, show = collapsed ? ids.slice(0, 11) : ids;
    const each = r.odds / total / ids.length * 100;
    return `<section class="tier" style="--c:${r.color}"><div class="th"><b>${r.name}</b><span>${ids.length} item${ids.length === 1 ? '' : 's'} · ${each < 0.01 ? each.toFixed(4) : each.toFixed(2)}% each</span><span class="pct">${(r.odds / total * 100).toFixed(2)}%</span></div>
      <div class="cgrid">${show.map(id => ctCard(D.items[id])).join('')}${collapsed ? `<button class="more" data-more="1">Show all ${ids.length}</button>` : ''}</div></section>`;
  }).join('');
  renderCtDetail();
}
function ctCard(it){
  const worst = priceOf(it, it.max_float, false), best = priceOf(it, it.min_float, false), skin = it.pattern || it.name.replace(/^★ /, '');
  const w = wearRange(it);
  return `<div class="icard${it.id === ctSel ? ' sel' : ''}" data-id="${it.id}" style="--c:${it.color}" title="${it.name}">
    <div class="top">${it.stattrak ? '<span class="st">StatTrak™</span>' : ''}<span class="wr">${w.length > 1 ? w[0] + '-' + w[w.length - 1] : w[0] || ''}</span></div>
    ${itemImg(it)}<div class="wn">${it.weapon}</div><div class="sn">${skin}</div><div class="pr">${worst === best ? money(best) : money(worst) + ' - ' + money(best)}</div></div>`;
}
function renderCtDetail(){
  const it = ctSel && D.items[ctSel];
  if (!it || !(cur.drops.includes(it.id) || cur.rare.includes(it.id))){ ctSel = null; $('ctDetail').innerHTML = '<div class="hint"></div>'; return; }
  const pool = poolFor(cur), tiers = D.rarities.filter(r => pool[r.name].length), total = tiers.reduce((s, r) => s + r.odds, 0);
  const tier = tiers.find(r => r.name === (cur.rare.includes(it.id) ? 'Rare Special Item' : it.rarity)), chance = tier.odds / total / pool[tier.name].length * 100;
  const worst = priceOf(it, it.max_float, false), best = priceOf(it, it.min_float, false);
  $('ctDetail').style.setProperty('--c', it.color);
  $('ctDetail').innerHTML = `<div class="dimg">${itemImg(it)}</div>
    <div><div class="dw">${it.weapon}</div><div class="dn">${it.pattern || it.name}</div></div>
    <div class="dr">${it.rarity}</div>
    <dl><dt>Chance</dt><dd>${chance < 0.01 ? chance.toFixed(4) : chance.toFixed(2)}% per opening</dd><dt>Conditions</dt><dd>${it.wears.join(', ')}</dd>
      <dt>StatTrak™</dt><dd>${it.stattrak ? 'Yes (1 in 10)' : 'No'}</dd><dt>Value</dt><dd class="val">${worst === best ? money(best) : money(worst) + ' - ' + money(best)}</dd></dl>
`;
}

// the reel uses small copies of the pictures (scripts/make_thumbs.py): up to 350 can be on screen, and these are ~8x lighter to load and decode
const thumbSrc = it => it.image.replace('/skins/', '/skins/thumb/').replace(/\.png$/, '.webp');
const thumbCache = new Map();                                            // kept so the browser doesn't drop them before the spin
function preloadCase(c){
  [...c.drops, ...c.rare].forEach(id => { const it = D.items[id]; if (!it || thumbCache.has(id)) return; const im = new Image(); im.decoding = 'async'; im.src = thumbSrc(it); thumbCache.set(id, im); im.decode?.().catch(() => {}); });
}
function tileHTML(item, win){
  return `<div class="tile" style="--c:${item.color}"><div class="in"><img src="${thumbSrc(item)}" decoding="async" alt=""></div></div>`;
}

function buildStrip(winner, strip){
  const pool = poolFor(cur), winIdx = 52 + Math.floor(rand() * 8);
  const tiles = [], count = winIdx + Math.ceil($('stage').clientWidth / PITCH / 2) + 3;      // nothing past what can be seen at the end
  for (let i = 0; i < count; i++) tiles.push(tileHTML(i === winIdx ? winner : rollItem(pool), i === winIdx));
  strip.innerHTML = tiles.join('');
  return winIdx;
}

// how many cases can be opened at once: up to 5, as many as you have keys for (the free case: one)
function maxCount(){
  const i = cur && caseInfo[cur.id];
  return !i || i.free ? 5 : Math.max(1, Math.min(5, caseKeys(cur.id)));
}
const feedItems = [];
function renderFeed(fresh){
  $('feed').classList.toggle('on', feedItems.length > 0);
  $('feed').innerHTML = feedItems.map((f, i) => `<div class="fd${f.sold ? '' : ' kept'}${fresh && i < fresh ? ' new' : ''}" style="--c:${f.item.color}">${itemImg(f.item, false, f.wear)}<div class="n">${f.item.pattern || f.item.name.replace(/^★ /, '')}</div><div class="p">${f.sold ? 'Sold ' : ''}${money(f.price)}</div></div>`).join('');
}
// everything the Stats page shows is counted here as it happens, and saved in the browser
const STATS_KEY = 'unboxd.stats.v1';
const stats = { since: Date.now(), opened: 0, keysUsed: 0, keysBought: 0, keysSpent: 0, soldN: 0, soldCents: 0, rarity: {}, best: null,
  upN: 0, upWin: 0, upStaked: 0, upWonCents: 0, merges: 0, trades: 0, dailyN: 0, dailyCents: 0 };
try { Object.assign(stats, JSON.parse(localStorage.getItem(STATS_KEY) || '{}')); } catch {}
const saveStats = () => { try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch {} };
const stat = (k, n = 1) => { stats[k] = (stats[k] || 0) + n; saveStats(); };
let openCount = 1, loopOn = false;
// auto sell / keep rolling, saved in the browser. A drop is sold on the spot when auto sell is on, its rarity is ticked, it isn't a
// StatTrak you want to keep and it isn't worth the keep-above amount or more.
const PREFS_KEY = 'unboxd.prefs.v1';
const prefs = { autoSell: false, sellRarities: { 'Mil-Spec Grade': true, 'Restricted': true }, keepAbove: 1000, keepStatTrak: true, roll: false, stun: 'stun:stun.l.google.com:19302', signal: '', turn: '', turnUser: '', turnPass: '' };
try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREFS_KEY) || '{}')); } catch {}
const savePrefs = () => { try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch {} };
const autoSellRule = d => prefs.autoSell && !!prefs.sellRarities[d.item.rarity] && !(prefs.keepStatTrak && d.stattrak)
  && !(prefs.keepAbove > 0 && sellPrice(d.item, d.float, d.stattrak, d.free) >= prefs.keepAbove);
const RARITY_LABEL = { 'Mil-Spec Grade': 'Mil-Spec', 'Restricted': 'Restricted', 'Classified': 'Classified', 'Covert': 'Covert', 'Rare Special Item': 'Knives & gloves' };
function renderPrefs(){
  $('tgSell').classList.toggle('on', prefs.autoSell);
  ['tgRoll', 'swRoll'].forEach(id => $(id) && $(id).classList.toggle('on', prefs.roll));
  $('swStat').classList.toggle('on', prefs.keepStatTrak);
  $('keepAbove').value = prefs.keepAbove ? prefs.keepAbove / 100 : '';
  if (D) $('sellRarities').innerHTML = D.rarities.map(r => `<button class="chip${prefs.sellRarities[r.name] ? ' on' : ''}" data-r="${r.name}" style="--c:${r.color}">${RARITY_LABEL[r.name] || r.name}</button>`).join('');
}
const ROW_H = [0, 210, 150, 120, 100, 88];      // reel height in px by how many reels are showing

async function open(auto){
  if (loopOn && !auto){ loopOn = false; refreshEconomy(); return; }          // pressed while rolling: stop after this spin
  if (!cur || busy) return;
  const quiet = prefs.roll;                                                  // rolling: no card, the reels and your balance are the feedback
  if (quiet) loopOn = true;
  if (quiet && !auto){ feedItems.length = 0; renderFeed(); }
  const info = caseInfo[cur.id], n = Math.min(openCount, maxCount());
  if (info && !info.free){ if (caseKeys(cur.id) < n){ keyMsg = n > 1 ? `You need ${n} keys for that.` : 'You need a key for this case.'; loopOn = false; refreshEconomy(); return; } wallet.keys[info.key.id] -= n; stat('keysUsed', n); keyMsg = ''; saveWallet(); }
  busy = true; $('open').disabled = true; refreshEconomy();
  backTo = !quiet && window.scrollY > 40 ? window.scrollY : null;          // opened from further down the page: scroll up to the reels, and come back afterwards
  if (backTo !== null) window.scrollTo({ top: 0, behavior: 'smooth' });
  document.querySelectorAll('.case').forEach(el => el.style.pointerEvents = 'none');
  $('idle').style.display = 'none';
  ctx().resume?.(); if (!quiet) snd('open', .8);

  // The outcomes are decided up front; the reels just animate to them.
  const drops = Array.from({ length: n }, () => { const d = rollDrop(cur); d.free = !!info?.free; d.auto = autoSellRule(d); return d; });
  if (!quiet){ n === 1 ? buildResult(drops[0]) : buildMulti(drops); $('result').classList.add('preload'); }          // laid out but invisible, so the card is ready to show when the bars stop
  $('stage').style.setProperty('--rh', ROW_H[n] + 'px'); $('stage').classList.toggle('multi', n > 1);
  const wasShut = $('reelSec').classList.contains('collapsed');
  $('reelSec').classList.remove('collapsed');                          // the reel opens out from nothing, pushing the cases down
  $('stage').style.height = (n * ROW_H[n] + (n - 1) + 2) + 'px';
  $('reels').innerHTML = drops.map(() => '<div class="reel"><div class="strip"></div></div>').join('');
  const strips = [...document.querySelectorAll('#reels .strip')], W = $('stage').clientWidth;
  const winIdx = strips.map((s, k) => buildStrip(drops[k].item, s));
  // have the tile pictures decoded before the bars start (at most half a second), instead of decoding them as they scroll in
  const seenSrc = new Set(), decoded = Promise.all(strips.flatMap(s => [...s.querySelectorAll('img')]).filter(i => !seenSrc.has(i.src) && seenSrc.add(i.src)).map(i => i.decode().catch(() => {})));   // each picture once, not once per tile
  await Promise.race([decoded, new Promise(r => setTimeout(r, 500))]);
  if (wasShut) await new Promise(r => setTimeout(r, 520));            // let it finish opening before the spin starts
  anims = strips.map((strip, k) => {
    const offset = (rand() - 0.5) * PITCH * 0.76;            // land anywhere inside the winning tile
    const end = -(winIdx[k] * PITCH + PITCH / 2 + offset - W / 2);
    return strip.animate([{ transform: 'translateX(0)' }, { transform: `translateX(${end}px)` }],       // one long slowing run, straight onto the item
      { duration: SPIN_MS, easing: 'cubic-bezier(.12,.62,.08,1)', fill: 'forwards' });
  });
  anim = anims[0];

  let last = -1;
  const loop = () => {
    if (!anim || anim.playState === 'finished') return;
    const x = new DOMMatrixReadOnly(getComputedStyle(strips[0]).transform).m41;
    const idx = Math.floor((W / 2 - x) / PITCH);
    if (idx !== last){ if (last !== -1 && !quiet) tick(); last = idx; }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);

  try { await Promise.all(anims.map(a => a.finished)); } catch { return; }
  if (!quiet){                                                       // the item it landed on stays lit, everything else dims

// ---------------- merge ----------------
// Two skins of the same weapon always merge into ONE skin of that weapon, and what you get is worth a little MORE than the two together:
// 3% more (at least a cent). The skin is the one of that weapon closest to that value; if the nearest skin would be much dearer, you get
// the best skin that is a bit cheaper and the difference in cash instead, so the total is always right. A skin that came out of a merge
// carries no bonus, so merging merged skins can't pile it up (it still never loses). No luck involved.

function mgPlan(items){
  if (items.length !== 2) return null;

  if (D.items[items[1].id].weapon !== w) return null;
  const vals = items.map(valueOf), V = vals[0] + vals[1], best = Math.max(...vals), bonus = items.some(i => i.merged) ? 0 : MERGE_BONUS;
  const target = Math.max(V + 1, Math.ceil(V * (1 + bonus))), cap = Math.ceil(V * (1 + MERGE_SLACK)) + 1;
  let up = null, below = null;                                           // the closest skin that reaches the target, and the best one under it
  targetPool().filter(x => x.it.weapon === w).forEach(x => {
    const lo = x.range[0], hi = x.range[1], at = f => sellPrice(x.it, f, false, false);
    if (at(lo) >= target){                                                // can reach the target: use the highest float that still does
      let float = hi, value = at(hi);
      if (value < target){ let a = lo, b = hi; for (let k = 0; k < 24; k++){ const m = (a + b) / 2; if (at(m) >= target) a = m; else b = m; } float = a; value = at(a); }
      if (value <= cap && (!up || value < up.value)) up = { it: x.it, wear: x.wear, float, value };
    } else if (at(lo) > best && (!below || at(lo) > below.value)) below = { it: x.it, wear: x.wear, float: lo, value: at(lo) };
  });

  if (below) return { w, V, out: below, cash: target - below.value };

}

// ---------------- trading ----------------
// Two browsers talk through a message broker. Both sides list the skins and keys they give, both press Confirm, and when both have confirmed
// the exact same trade each side swaps the skins and keys in its own save.
// Nothing here can stop a player who edits their own save from offering skins they don't have, so trade with people you trust.
let tr = null;                                   // { peer, conn, role: 'host' | 'join', open, mine: [uids], theirs: [items], myReady, theirReady }

}
function trSend(m){ if (tr && tr.peer) tr.client.publish(tr.topic, JSON.stringify({ id: tr.id, to: tr.peer, ...m }), { qos: 1 }); }

function showCaseItem(id){                     // from the Contents tab: what it is, its odds, and each condition
  const it = D.items[id], st = { on: false };
  const pool = poolFor(cur), tiers = D.rarities.filter(r => pool[r.name].length), total = tiers.reduce((s, r) => s + r.odds, 0);
  const tier = tiers.find(r => r.name === (cur.rare.includes(id) ? 'Rare Special Item' : it.rarity)), chance = tier.odds / total / pool[tier.name].length * 100;
  let wear = it.wears[Math.min(it.wears.length - 1, Math.floor(it.wears.length / 2))];
  const draw = () => {
    $('itPage').style.setProperty('--c', it.color);
    $('itPage').innerHTML = `<div class="big">${itemImg(it, false, wear)}</div>
      <div class="side"><div><div class="w">${it.weapon}</div><div class="n">${it.pattern || it.name.replace(/^★ /, '')}</div><div class="r">${it.rarity}</div></div>
        <div class="conds">${it.wears.map(w => `<button class="cond${w === wear ? ' on' : ''}" data-w="${w}"><span>${w}</span><b>${priceSpan(it, w, false)}</b></button>`).join('')}</div>
        <div class="facts"><div class="row"><span>Chance</span><b>${chance < 0.01 ? chance.toFixed(4) : chance.toFixed(2)}%</b></div>${it.stattrak ? `<div class="row" style="margin-top:6px"><span>StatTrak™</span><b>1 in 10</b></div>` : ''}</div></div>`;
    $('itPage').querySelectorAll('[data-w]').forEach(b => b.onclick = () => { wear = b.dataset.w; const big = $('itPage').querySelector('.big'); big.innerHTML = itemImg(it, false, wear); itReveal(); $('itPage').querySelectorAll('.cond').forEach(c => c.classList.toggle('on', c.dataset.w === wear)); });
  };
  draw(); itReveal(); openItemPage('contents');
}
function showOwnedItem(uid){                   // from the inventory: yours, in its condition, with the sell button
  const i = inventory.find(x => x.uid === uid), it = i && D.items[i.id]; if (!it) return;
  $('itPage').style.setProperty('--c', it.color);
  $('itPage').innerHTML = `<div class="big">${itemImg(it, false, i.wear)}</div>
    <div class="side"><div><div class="w">${it.weapon}</div><div class="n">${i.stattrak ? '<span class="st">StatTrak™</span> ' : ''}${it.pattern || it.name.replace(/^★ /, '')}</div><div class="r">${it.rarity}</div></div>
      <div class="row"><span>Condition</span><b>${i.wear}</b></div>
      <div class="price">${money(valueOf(i))}</div>
      <div class="btnrow"><button class="lockbtn" id="itLock"></button><button class="sell" id="itSell">Sell</button></div></div>`;
  const paint = () => { $('itLock').textContent = i.locked ? 'Unlock' : 'Lock'; $('itSell').disabled = !!i.locked; $('itSell').textContent = i.locked ? 'Locked' : 'Sell'; };
  paint();
  $('itLock').onclick = () => { i.locked = !i.locked; if (!i.locked) delete i.locked; saveInv(); renderInventory(); paint(); };
  $('itSell').onclick = () => { if (i.locked) return; sellByUid(uid); closeItemPage(); };
  itReveal(); openItemPage('inventory');
}

// a confirm box in the game's own style: resolves true on OK / Enter, false on Cancel / Esc / a click outside
function askConfirm(html, { ok = 'OK', danger = false, cancel = 'Cancel', single = false, wide = false } = {}){
  return new Promise(res => {
    const dlg = $('dlg'), yes = $('dlgYes'), no = $('dlgNo'); $('dlgText').innerHTML = html; yes.textContent = ok; yes.classList.toggle('danger', danger); no.textContent = cancel; no.style.display = single ? 'none' : ''; $('dlgBox').classList.toggle('wide', wide);
    dlg.classList.remove('out'); dlg.classList.add('show'); dlg.setAttribute('aria-hidden', 'false'); yes.focus();
    const done = v => { dlg.classList.remove('show'); dlg.classList.add('out'); setTimeout(() => dlg.classList.remove('out'), 150); dlg.setAttribute('aria-hidden', 'true'); cleanup(); res(v); };
    const key = e => { if (e.key === 'Escape'){ e.preventDefault(); done(false); } else if (e.key === 'Enter' && document.activeElement !== no){ e.preventDefault(); done(true); } };
    const outside = e => { if (e.target === dlg) done(false); };
    const cleanup = () => { removeEventListener('keydown', key, true); dlg.removeEventListener('pointerdown', outside); yes.onclick = no.onclick = null; };
    addEventListener('keydown', key, true); dlg.addEventListener('pointerdown', outside); yes.onclick = () => done(true); no.onclick = () => done(false);
  });
}
$('sellAll').onclick = async () => {
  const open = inventory.filter(i => !i.locked), kept = inventory.length - open.length, v = payout(open.reduce((s, i) => s + (D.items[i.id] ? valueOf(i) : 0), 0));
  if (!open.length) return askConfirm(kept ? 'Everything you have is locked.<small>Unlock a skin on its page to sell it.</small>' : 'Nothing to sell.', { ok: 'OK' });
  if (await askConfirm(`Sell ${open.length} skin${open.length === 1 ? '' : 's'} for <b>${money(v)}</b>?${kept ? `<small>${kept} locked skin${kept === 1 ? ' stays' : 's stay'} in your inventory.</small>` : ''}`, { ok: 'Sell' })) sellMany(open);
};

// ---- our own dropdowns instead of the browser's: same <select> underneath (so value / change keep working), a styled list on top ----
function enhanceSelect(sel){
  const wrap = document.createElement('div'); wrap.className = 'dd' + (sel.id ? ' dd-' + sel.id : '');
  sel.parentNode.insertBefore(wrap, sel); wrap.appendChild(sel); sel.classList.add('dd-native'); sel.tabIndex = -1;
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'dd-btn';
  btn.innerHTML = '<span></span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>';
  const pop = document.createElement('div'); pop.className = 'dd-pop';
  wrap.append(btn, pop);
  const sync = () => { btn.firstChild.textContent = sel.selectedOptions[0]?.textContent || ''; };
  sel.ddSync = sync; sel.addEventListener('change', sync); sync();
  let q = null;
  const fill = (filter = '') => {
    const list = pop.querySelector('.dd-list') || pop.appendChild(Object.assign(document.createElement('div'), { className: 'dd-list' }));
    list.innerHTML = [...sel.options].filter(o => o.textContent.toLowerCase().includes(filter.toLowerCase()))
      .map(o => `<button type="button" class="dd-opt${o.value === sel.value ? ' on' : ''}" data-v="${o.value}">${o.textContent}</button>`).join('') || '<div class="dd-none">No match</div>';
  };
  const close = () => { wrap.classList.remove('open'); };
  const open = () => {
    document.querySelectorAll('.dd.open').forEach(d => d !== wrap && d.classList.remove('open'));
    sync();
    if (sel.options.length > 12){
      if (!q){ q = document.createElement('input'); q.type = 'search'; q.placeholder = 'Search'; q.className = 'dd-q'; pop.prepend(q); q.oninput = () => fill(q.value); }
      q.value = '';
    }
    fill(); wrap.classList.add('open'); pop.style.left = pop.style.right = '';
    const r = pop.getBoundingClientRect(); if (r.right > innerWidth - 8) { pop.style.left = 'auto'; pop.style.right = '0'; }
    pop.querySelector('.dd-opt.on')?.scrollIntoView({ block: 'nearest' }); q?.focus({ preventScroll: true });
  };
  btn.onclick = () => wrap.classList.contains('open') ? close() : open();
  pop.onclick = e => {
    const o = e.target.closest('.dd-opt'); if (!o) return;
    sel.value = o.dataset.v; sync(); close(); sel.dispatchEvent(new Event('change', { bubbles: true }));
  };
  wrap.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ close(); btn.focus(); }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      const items = [...pop.querySelectorAll('.dd-opt')]; if (!items.length || !wrap.classList.contains('open')) return;
      e.preventDefault(); const i = items.indexOf(document.activeElement); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
    }
  });
}
document.querySelectorAll('select').forEach(enhanceSelect);
